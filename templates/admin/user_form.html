{% extends 'base.html' %}
{% block title %}{{ '修改使用者' if edit_user else '新增使用者' }} — 系統設定{% endblock %}
{% block content %}
<div class="container py-3" style="max-width:560px">
  <div class="d-flex align-items-center mb-3">
    <a href="{{ url_for('admin_users') }}" class="btn btn-sm btn-outline-secondary me-2">
      <i class="bi bi-arrow-left"></i>
    </a>
    <h5 class="mb-0">{{ '修改使用者' if edit_user else '新增使用者' }}</h5>
  </div>

  <div class="card shadow-sm">
    <div class="card-body">
      <form method="post" autocomplete="off">
        {% if not edit_user %}
        <div class="mb-3">
          <label class="form-label fw-semibold">帳號 <span class="text-danger">*</span></label>
          <input type="text" class="form-control" name="new_uname" id="f_username"
                 required autocomplete="off">
        </div>
        {% endif %}
        <div class="mb-3">
          <label class="form-label fw-semibold">
            密碼 {% if not edit_user %}<span class="text-danger">*</span>{% else %}<small class="text-muted">（留空不修改）</small>{% endif %}
          </label>
          <input type="password" class="form-control" name="new_pwd" id="f_password"
                 {{ 'required' if not edit_user else '' }} autocomplete="new-password">
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">姓名 <span class="text-danger">*</span></label>
          <input type="text" class="form-control" name="name"
                 value="{{ edit_user.name if edit_user else '' }}" required>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">部門</label>
          <input type="text" class="form-control" name="department"
                 value="{{ edit_user.department if edit_user else '' }}">
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Email</label>
          <input type="email" class="form-control" name="email"
                 value="{{ edit_user.email if edit_user else '' }}">
        </div>
        <div class="mb-4">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" name="is_admin" id="isAdmin"
                   {{ 'checked' if edit_user and edit_user.is_admin else '' }}>
            <label class="form-check-label" for="isAdmin">管理員權限</label>
          </div>
        </div>
        <div class="d-flex gap-2 justify-content-end">
          <a href="{{ url_for('admin_users') }}" class="btn btn-secondary btn-sm">取消</a>
          <button type="submit" class="btn btn-primary btn-sm">
            <i class="bi bi-check-lg me-1"></i>{{ '儲存' if edit_user else '新增' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
{% if not edit_user %}
<script>
  /* Chrome 會在 DOMContentLoaded 後才填入 autocomplete，用 setTimeout 強制清空 */
  function clearAutoFill() {
    const u = document.getElementById('f_username');
    const p = document.getElementById('f_password');
    if (u) u.value = '';
    if (p) p.value = '';
  }
  clearAutoFill();
  setTimeout(clearAutoFill, 100);
  setTimeout(clearAutoFill, 300);
</script>
{% endif %}
{% endblock %}
