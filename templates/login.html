{% extends 'base.html' %}
{% block title %}登入 — 文件管理系統{% endblock %}
{% block content %}
<div class="d-flex align-items-center justify-content-center" style="min-height:calc(100vh - 56px)">
  <div class="card shadow-sm" style="width:360px">
    <div class="card-body p-4">
      <div class="text-center mb-4">
        <i class="bi bi-folder2-open text-primary" style="font-size:3rem"></i>
        <h5 class="mt-2 fw-bold">文件管理系統</h5>
        <small class="text-muted">請登入以繼續</small>
      </div>
      <form method="post">
        <div class="mb-3">
          <label class="form-label">帳號</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-person"></i></span>
            <input type="text" class="form-control" name="username" required autofocus>
          </div>
        </div>
        <div class="mb-4">
          <label class="form-label">密碼</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input type="password" class="form-control" name="password" required>
          </div>
        </div>
        <button class="btn btn-primary w-100" type="submit">
          <i class="bi bi-box-arrow-in-right me-1"></i>登入
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
