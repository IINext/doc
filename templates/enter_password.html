{% extends 'base.html' %}
{% block title %}輸入密碼 — 文件管理系統{% endblock %}
{% block content %}
<div class="d-flex align-items-center justify-content-center" style="min-height:calc(100vh - 56px)">
  <div class="card shadow-sm" style="width:380px">
    <div class="card-body p-4">
      <h6 class="mb-1"><i class="bi bi-lock-fill text-warning me-2"></i>此文件已加密</h6>
      {% if subject %}
      <p class="small text-muted mb-3">{{ subject }}</p>
      {% endif %}

      <div class="mb-3">
        <label class="form-label">請輸入密碼</label>
        <div class="input-group">
          <input type="password" class="form-control" id="pwField" autofocus
                 placeholder="下載密碼"
                 onkeydown="if(event.key==='Enter') doDownload()">
          <button class="btn btn-outline-secondary" type="button"
                  onclick="togglePw()" title="顯示/隱藏">
            <i class="bi bi-eye" id="eyeIcon"></i>
          </button>
        </div>
        <div class="text-danger small mt-1 d-none" id="pwError">
          <i class="bi bi-exclamation-circle me-1"></i>密碼錯誤，請重新輸入
        </div>
      </div>

      <!-- 下載進度提示 -->
      <div class="d-none mb-3" id="dlProgress">
        <div class="progress" style="height:6px">
          <div class="progress-bar progress-bar-striped progress-bar-animated w-100"></div>
        </div>
        <div class="small text-muted mt-1 text-center">檔案下載中，請稍候…</div>
      </div>

      <div class="d-flex gap-2" id="btnRow">
        <a href="{{ return_url or url_for('index') }}" class="btn btn-secondary btn-sm">取消</a>
        <button type="button" class="btn btn-primary btn-sm flex-grow-1"
                onclick="doDownload()">
          <i class="bi bi-download me-1"></i>確認下載
        </button>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const DOC_ID    = {{ doc_id }};
const RETURN_URL = {{ (return_url or url_for('index')) | tojson }};

function togglePw() {
  const f = document.getElementById('pwField');
  const i = document.getElementById('eyeIcon');
  if (f.type === 'password') {
    f.type = 'text';
    i.className = 'bi bi-eye-slash';
  } else {
    f.type = 'password';
    i.className = 'bi bi-eye';
  }
}

function doDownload() {
  const pw  = document.getElementById('pwField').value;
  const err = document.getElementById('pwError');
  const prg = document.getElementById('dlProgress');
  const btn = document.getElementById('btnRow');
  err.classList.add('d-none');

  const url = `/doc/${DOC_ID}/download?password=${encodeURIComponent(pw)}`;

  // 顯示進度列，隱藏按鈕區
  prg.classList.remove('d-none');
  btn.classList.add('d-none');

  fetch(url, { credentials: 'same-origin' })
    .then(resp => {
      const cd = resp.headers.get('Content-Disposition') || '';
      if (cd.includes('attachment')) {
        // 密碼正確：取 Blob → 觸發下載 → 跳回前頁
        const filenameMatch = cd.match(/filename[^=\n]*=\s*(?:UTF-8''|")?([^";\n]+)/i);
        const filename = filenameMatch
          ? decodeURIComponent(filenameMatch[1].replace(/\+/g,' '))
          : 'download';
        return resp.blob().then(blob => {
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = filename;
          document.body.appendChild(a);
          a.click();
          a.remove();
          // 短暫等候瀏覽器接手下載後跳回
          setTimeout(() => { window.location.href = RETURN_URL; }, 600);
        });
      } else {
        // 密碼錯誤：顯示錯誤，還原按鈕
        prg.classList.add('d-none');
        btn.classList.remove('d-none');
        err.classList.remove('d-none');
        document.getElementById('pwField').focus();
        document.getElementById('pwField').select();
      }
    })
    .catch(() => {
      prg.classList.add('d-none');
      btn.classList.remove('d-none');
      err.textContent = '下載失敗，請稍後再試';
      err.classList.remove('d-none');
    });
}
</script>
{% endblock %}
