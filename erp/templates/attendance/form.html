{% extends 'base.html' %}
{% block title %}新增 出勤調整單 - ERP{% endblock %}
{% block content %}
<div class="d-flex align-items-center mb-3 gap-2">
  <a class="btn btn-outline-secondary btn-sm" href="{{ url_for('attendance.index') }}"><i class="bi bi-arrow-left"></i></a>
  <h5 class="mb-0">新增出勤調整單</h5>
</div>
<div class="card mb-3">
<div class="card-body">
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="row g-3">
    <div class="col-sm-4 col-lg-2">
      <label class="form-label" for="applicant">申請人（員工編號）</label>
      <input class="form-control" id="applicant" name="applicant" value="{{ f.applicant }}" required>
    </div>
    <div class="col-sm-4 col-lg-2">
      <label class="form-label" for="leave_type">扣薪假別</label>
      <select class="form-select" id="leave_type" name="leave_type" required>
        <option value="">請選擇</option>
        {% for k in kinds %}
        <option value="{{ k['代碼'].strip() }}" {% if k['代碼'].strip() == f.leave_type %}selected{% endif %}>
          {{ k['代碼'].strip() }} {{ k['名稱'].strip() }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-sm-4 col-lg-2">
      <label class="form-label" for="agent">代理人（員工編號）</label>
      <input class="form-control" id="agent" name="agent" value="{{ f.agent }}">
    </div>
    <div class="w-100 d-none d-lg-block"></div>
    <div class="col-sm-4 col-lg-2">
      <label class="form-label" for="start_date">起始日期</label>
      <input class="form-control" type="date" id="start_date" name="start_date"
             value="{{ f.start_date.isoformat() if f.start_date else '' }}" required>
    </div>
    <div class="col-sm-4 col-lg-2">
      <label class="form-label" for="start_time">起始時間</label>
      <input class="form-control" type="time" id="start_time" name="start_time"
             value="{{ f.start_time.strftime('%H:%M') if f.start_time else '' }}" required>
    </div>
    <div class="col-sm-4 col-lg-2">
      <label class="form-label" for="end_date">截止日期</label>
      <input class="form-control" type="date" id="end_date" name="end_date"
             value="{{ f.end_date.isoformat() if f.end_date else '' }}" required>
    </div>
    <div class="col-sm-4 col-lg-2">
      <label class="form-label" for="end_time">截止時間</label>
      <input class="form-control" type="time" id="end_time" name="end_time"
             value="{{ f.end_time.strftime('%H:%M') if f.end_time else '' }}" required>
    </div>
    <div class="col-sm-2 col-lg-1">
      <label class="form-label" for="days">天數</label>
      <input class="form-control" type="number" min="0" id="days" name="days" value="{{ f.days }}">
    </div>
    <div class="col-sm-2 col-lg-1">
      <label class="form-label" for="hours">時數</label>
      <select class="form-select" id="hours" name="hours" data-value="{{ '%g' % f.hours }}"></select>
    </div>
    <div class="col-12">
      <label class="form-label" for="reason">請假事由</label>
      <textarea class="form-control" id="reason" name="reason" rows="2">{{ f.reason }}</textarea>
    </div>
  </div>
  <div class="mt-3"><button class="btn btn-primary"><i class="bi bi-save"></i> 存檔並核定</button></div>
</form>
</div>
</div>
{% endblock %}

{% block scripts %}
<script>
const hourOptions = {{ hour_options | tojson }};
const kind = document.getElementById('leave_type');
const hours = document.getElementById('hours');
function fillHours() {
  const keep = hours.value || hours.dataset.value || '0';
  hours.innerHTML = '';
  for (const h of (hourOptions[kind.value] || ['0'])) {
    const v = String(Number(h));
    hours.add(new Option(v, v, false, v === String(Number(keep))));
  }
}
kind.addEventListener('change', fillHours);
fillHours();
</script>
{% endblock %}
