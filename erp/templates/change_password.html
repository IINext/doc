{% extends 'base.html' %}
{% block title %}變更密碼 - ERP{% endblock %}
{% block content %}
<div class="row justify-content-center mt-4">
  <div class="col-sm-8 col-md-5 col-lg-4">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h5 class="card-title mb-3">變更密碼</h5>
        {% if session.get('must_change') %}
        <div class="alert alert-warning py-2 small">第一次登入 ERP，請先設定新密碼。</div>
        {% endif %}
        <form method="post">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="mb-3">
            <label class="form-label" for="current">目前密碼</label>
            <input class="form-control" id="current" name="current" type="password" required autocomplete="current-password">
          </div>
          <div class="mb-3">
            <label class="form-label" for="new">新密碼（至少 8 個字元）</label>
            <input class="form-control" id="new" name="new" type="password" minlength="8" required autocomplete="new-password">
          </div>
          <div class="mb-3">
            <label class="form-label" for="confirm">再輸入一次新密碼</label>
            <input class="form-control" id="confirm" name="confirm" type="password" minlength="8" required autocomplete="new-password">
          </div>
          <button class="btn btn-primary w-100">儲存</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
